    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #fcf8f7;
        color: #201a19;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        font-family: 'Yu Gothic UI', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
        background:
          radial-gradient(ellipse 75% 45% at 10% -6%, rgba(179, 38, 30, 0.06) 0%, transparent 70%),
          radial-gradient(ellipse 65% 45% at 92% 106%, rgba(44, 93, 167, 0.05) 0%, transparent 70%),
          #fcf8f7;
      }
      .boot-splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        box-shadow: 0 4px 14px rgba(32, 26, 25, 0.12);
      }
      .boot-splash-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #201a19;
      }
      .boot-splash-track {
        width: 168px;
        height: 5px;
        border-radius: 999px;
        background: #ebe1df;
        overflow: hidden;
      }
      .boot-splash-bar {
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: #b3261e;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
